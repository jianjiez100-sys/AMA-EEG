# 实验C: 双分支 Attention（局部窗口 + 全局通道融合）
# 与 baseline cnn_att.yaml 的唯一差异：global_att='dual'
_target_: model.models.Conv_att_simple_new
n_timeFilters: 16
timeFilterLen: 30
n_msFilters: 4
msFilter_timeLen: 3
n_channs: ${data.n_channs}
dilation_array: [1,3,6,12]
seg_att: 15
avgPoolLen: 15
timeSmootherLen: 3
multiFact: 2
activ: 'sigmoid'
temp: 1.0
stratified: ['initial', 'middle1', 'middle2']
saveFea: False
has_att: True
extract_mode: ${ext_fea.mode}
global_att: 'dual'
proj_type: 'residual'   # 'bottleneck'(8.4M) 或 'residual'(2.1M+残差+LayerNorm)
use_ln_backbone: False   # True: 去掉 BN+ReLU, 纯 stratified_LN
